<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin - Cariominas FC</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { 
                        "primary": "#ec131e", 
                        "background-dark": "#1c1c1e", 
                        "background-light": "#f2f2f7",
                        "surface-dark": "#2c2c2e",
                        "accent-gold": "#e2b616"
                    },
                    fontFamily: { "display": ["Lexend", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body { background-color: #f2f2f7; color: #1c1c1e; font-family: 'Lexend', sans-serif; transition: background-color 0.4s ease; }
        html.dark body { background-color: #1c1c1e; color: #ffffff; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(14px); border: 1px solid rgba(0, 0, 0, 0.05); }
        html.dark .glass-panel { background: rgba(44, 44, 46, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-active { color: #ec131e; border-bottom: 2.5px solid #ec131e; }
        input, textarea, select { background-color: rgba(0, 0, 0, 0.04) !important; border: 1px solid rgba(0, 0, 0, 0.08) !important; border-radius: 14px !important; color: #1c1c1e !important; }
        html.dark input, html.dark textarea, html.dark select { background-color: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: #ffffff !important; }
        #admin-content { display: none; }
        #auth-check-screen { display: flex; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .custom-checkbox { width: 22px; height: 22px; border-radius: 8px; border: 2px solid rgba(128,128,128,0.3); appearance: none; cursor: pointer; position: relative; transition: all 0.2s; flex-shrink: 0; }
        .custom-checkbox:checked { background-color: #ec131e; border-color: #ec131e; }
        .custom-checkbox:checked::after { content: 'check'; font-family: 'Material Symbols Outlined'; font-size: 16px; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto pb-24">

    <div id="auth-check-screen" class="fixed inset-0 z-[1000] bg-background-light dark:bg-background-dark flex flex-col items-center justify-center p-6 text-center">
        <div id="auth-loading" class="flex flex-col items-center gap-4">
            <div class="size-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin"></div>
            <p class="text-xs font-bold uppercase tracking-widest text-gray-500">Autenticando...</p>
        </div>
        <div id="auth-denied" class="hidden flex-col items-center gap-6">
            <span class="material-symbols-outlined text-primary text-6xl">lock</span>
            <h2 class="text-2xl font-bold italic uppercase">Acesso Restrito</h2>
            <a href="index.html" class="bg-primary text-white px-8 py-3 rounded-2xl text-xs font-black uppercase tracking-widest">Sair</a>
        </div>
    </div>

    <!-- Modal Editar Atleta com Atributos Técnicos -->
    <div id="edit-modal" class="fixed inset-0 z-[1100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeEditModal()"></div>
        <div class="relative w-full max-w-lg glass-panel rounded-[2.5rem] p-8 shadow-2xl animate-in max-h-[90vh] overflow-y-auto no-scrollbar">
            <h2 class="text-xl font-bold mb-6 dark:text-white text-black">Ficha do Atleta</h2>
            <form id="editUserForm" class="space-y-6">
                <input type="hidden" id="edit-uid">
                
                <div class="space-y-4">
                    <p class="text-[10px] font-black uppercase opacity-30 tracking-widest px-1">Dados Básicos</p>
                    <input type="text" id="edit-nome" placeholder="Nome" class="w-full py-4 px-5">
                    <div class="grid grid-cols-2 gap-4">
                        <select id="edit-posicao" class="w-full py-4 px-5">
                            <option value="GOL">Goleiro</option><option value="ZAG">Zagueiro</option><option value="VOL">Volante</option><option value="MEI">Meia</option><option value="ATA">Atacante</option>
                        </select>
                        <select id="edit-categoria" class="w-full py-4 px-5">
                            <option value="Sub-13">Sub-13</option><option value="Sub-15">Sub-15</option><option value="Sub-17">Sub-17</option><option value="Profissional">Profissional</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-4">
                    <p class="text-[10px] font-black uppercase opacity-30 tracking-widest px-1">Atributos (Elite Card)</p>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                        <div class="space-y-1">
                            <label class="text-[9px] font-bold uppercase opacity-50 px-1">Overall</label>
                            <input type="number" id="edit-ovr" class="w-full py-3 px-4" min="0" max="99">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-bold uppercase opacity-50 px-1">Velocidade</label>
                            <input type="number" id="edit-vel" class="w-full py-3 px-4" min="0" max="99">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-bold uppercase opacity-50 px-1">Drible</label>
                            <input type="number" id="edit-dri" class="w-full py-3 px-4" min="0" max="99">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-bold uppercase opacity-50 px-1">Passe</label>
                            <input type="number" id="edit-pas" class="w-full py-3 px-4" min="0" max="99">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-bold uppercase opacity-50 px-1">Defesa</label>
                            <input type="number" id="edit-def" class="w-full py-3 px-4" min="0" max="99">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-bold uppercase opacity-50 px-1">Físico</label>
                            <input type="number" id="edit-phy" class="w-full py-3 px-4" min="0" max="99">
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeEditModal()" class="flex-1 py-4 rounded-2xl font-bold dark:text-white/40 text-black/40 uppercase text-[10px] tracking-widest">Cancelar</button>
                    <button type="submit" class="flex-1 bg-primary text-white py-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest shadow-lg shadow-primary/20">Salvar Tudo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Presenças -->
    <div id="presence-modal" class="fixed inset-0 z-[1100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closePresenceModal()"></div>
        <div class="relative w-full max-w-md glass-panel rounded-[2.5rem] p-8 shadow-2xl animate-in">
            <h2 class="text-xl font-bold mb-6 dark:text-white text-black">Lista de Presença</h2>
            <div id="presence-list" class="space-y-3 max-h-[60vh] overflow-y-auto no-scrollbar">
                <!-- Atletas que confirmaram aparecem aqui -->
            </div>
            <button onclick="closePresenceModal()" class="w-full mt-6 py-4 rounded-2xl bg-black/5 dark:bg-white/5 font-bold uppercase text-[10px] tracking-widest">Fechar</button>
        </div>
    </div>

    <div id="admin-content">
        <header class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-black italic uppercase tracking-tight">Painel <span class="text-primary">Admin</span></h1>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mt-1">Cariominas FC • Gestão Digital</p>
            </div>
            <button onclick="toggleTheme()" class="size-11 rounded-2xl glass-panel flex items-center justify-center shadow-sm">
                <span id="theme-icon" class="material-symbols-outlined text-[20px]">dark_mode</span>
            </button>
        </header>

        <nav class="flex gap-8 border-b dark:border-white/5 border-black/5 mb-8 overflow-x-auto no-scrollbar">
            <button onclick="switchTab('postar')" id="btn-postar" class="tab-btn pb-4 text-xs font-bold uppercase tracking-widest tab-active">Criar</button>
            <button onclick="switchTab('gerenciar-noticias')" id="btn-gerenciar-noticias" class="tab-btn pb-4 text-xs font-bold uppercase tracking-widest text-gray-500">Notícias</button>
            <button onclick="switchTab('gerenciar-eventos')" id="btn-gerenciar-eventos" class="tab-btn pb-4 text-xs font-bold uppercase tracking-widest text-gray-500">Agenda</button>
            <button onclick="switchTab('usuarios')" id="btn-usuarios" class="tab-btn pb-4 text-xs font-bold uppercase tracking-widest text-gray-500">Atletas</button>
        </nav>

        <div id="tab-postar" class="tab-content space-y-8">
            <section class="p-6 rounded-3xl glass-panel shadow-2xl">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-3"><span class="material-symbols-outlined text-primary">feed</span> Nova Notícia</h2>
                <form id="newsForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="newsTitle" placeholder="Título" class="md:col-span-2 py-4 px-5" required>
                    <input type="url" id="newsImage" placeholder="URL Capa" class="py-4 px-5" required>
                    <input type="text" id="newsDate" placeholder="Data (Ex: 12 Jan)" class="py-4 px-5" required>
                    <textarea id="newsBody" placeholder="Corpo da notícia..." class="md:col-span-2 py-4 px-5" rows="3"></textarea>
                    <button type="submit" class="md:col-span-2 bg-primary text-white font-black uppercase tracking-widest py-4 rounded-2xl shadow-xl shadow-primary/20">Publicar</button>
                </form>
            </section>

            <section class="p-6 rounded-3xl glass-panel shadow-2xl">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-3"><span class="material-symbols-outlined text-primary">calendar_month</span> Novo Evento</h2>
                <form id="eventForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="eventTitle" placeholder="Título" class="md:col-span-2 py-4 px-5" required>
                    <select id="eventType" class="py-4 px-5">
                        <option value="Treino">Treino</option><option value="Jogo">Jogo</option><option value="Torneio">Torneio</option>
                    </select>
                    <input type="text" id="eventDate" placeholder="Data (Ex: 15 Jan)" class="py-4 px-5" required>
                    <input type="text" id="eventLocation" placeholder="Local" class="py-4 px-5" required>
                    <input type="time" id="eventTime" class="py-4 px-5" required>
                    <button type="submit" class="md:col-span-2 bg-primary text-white font-black uppercase tracking-widest py-4 rounded-2xl shadow-xl shadow-primary/20">Agendar</button>
                </form>
            </section>
        </div>

        <div id="tab-usuarios" class="tab-content hidden space-y-6">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1 relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 opacity-30">search</span>
                    <input type="text" id="user-search" placeholder="Buscar atleta pelo nome..." class="w-full pl-12 py-4 px-5" oninput="filterUsers()">
                </div>
                <select id="filter-categoria" class="py-4 px-5 min-w-[160px]" onchange="filterUsers()">
                    <option value="">Todas Categorias</option>
                    <option value="Sub-13">Sub-13</option><option value="Sub-15">Sub-15</option><option value="Sub-17">Sub-17</option><option value="Profissional">Profissional</option>
                </select>
            </div>

            <!-- Controles de Seleção e Ações em Massa -->
            <div class="p-5 rounded-3xl glass-panel space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex gap-2">
                        <button onclick="selectAllUsers()" class="px-4 py-2 rounded-xl bg-black/5 dark:bg-white/5 text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">Todos</button>
                        <button onclick="deselectAllUsers()" class="px-4 py-2 rounded-xl bg-black/5 dark:bg-white/5 text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">Nenhum</button>
                    </div>
                    <p id="selection-counter" class="text-[10px] font-bold opacity-30 uppercase tracking-widest">0 atletas selecionados</p>
                </div>
                
                <div id="mass-action-area" class="hidden flex flex-col sm:flex-row gap-3 pt-2 border-t dark:border-white/5 border-black/5 animate-in">
                    <select id="mass-category" class="flex-1 py-3 px-4 text-xs">
                        <option value="">Mudar para Categoria...</option>
                        <option value="Sub-13">Sub-13</option><option value="Sub-15">Sub-15</option><option value="Sub-17">Sub-17</option><option value="Profissional">Profissional</option>
                    </select>
                    <button onclick="applyMassCategory()" class="bg-primary text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg shadow-primary/20">Aplicar em Massa</button>
                </div>
            </div>

            <div id="users-list" class="grid grid-cols-1 gap-4">
                <p class="text-center py-10 opacity-40">Carregando atletas...</p>
            </div>
        </div>

        <div id="tab-gerenciar-noticias" class="tab-content hidden space-y-4">
            <div id="news-list" class="grid grid-cols-1 gap-4"></div>
        </div>

        <div id="tab-gerenciar-eventos" class="tab-content hidden space-y-4">
            <div id="events-list" class="grid grid-cols-1 gap-4"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, getDocs, collectionGroup, where, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const configReal = {
            apiKey: "AIzaSyBAyhAtApmZ9oYi6fu_cX_H25WYXk513HI",
            authDomain: "cariominasapp.firebaseapp.com",
            projectId: "cariominasapp",
            storageBucket: "cariominasapp.firebasestorage.app",
            messagingSenderId: "337748582700",
            appId: "1:337748582700:web:8fa4c9ee92b6d02c374c89"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : configReal;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cariominasapp';

        let allUsers = [];
        let selectedUids = new Set();

        window.toggleTheme = () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        };

        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if (icon) icon.innerText = document.documentElement.classList.contains('dark') ? 'light_mode' : 'dark_mode';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-check-screen').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                fetchUsers();
            } else {
                document.getElementById('auth-loading').style.display = 'none';
                document.getElementById('auth-denied').classList.remove('hidden');
            }
        });

        window.switchTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('tab-active', 'text-primary');
                b.classList.add('text-gray-500');
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).classList.add('tab-active', 'text-primary');
            document.getElementById(`btn-${tabId}`).classList.remove('text-gray-500');
        };

        async function fetchUsers() {
            try {
                const q = query(collectionGroup(db, 'settings'), where('overall', '>=', 0));
                const snap = await getDocs(q);
                allUsers = snap.docs.map(d => {
                    const pathParts = d.ref.path.split('/');
                    const uid = pathParts[4]; 
                    return { uid, ...d.data() };
                });
                renderUsers(allUsers);
            } catch (err) {
                console.error("Erro ao buscar usuários:", err);
                document.getElementById('users-list').innerHTML = `<p class='text-center opacity-40 text-xs py-10'>Erro de permissão ou índice ausente no Firestore.</p>`;
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('users-list');
            if (users.length === 0) {
                container.innerHTML = '<p class="text-center py-10 opacity-30 text-xs uppercase font-bold tracking-widest">Nenhum atleta encontrado</p>';
                return;
            }
            container.innerHTML = users.map(u => `
                <div class="p-5 rounded-3xl glass-panel flex flex-col md:flex-row justify-between items-center gap-4 transition-all">
                    <div class="flex items-center gap-4 w-full">
                        <input type="checkbox" class="custom-checkbox" ${selectedUids.has(u.uid) ? 'checked' : ''} onchange="toggleUserSelection('${u.uid}')">
                        <div class="size-12 rounded-full overflow-hidden bg-black/10 shrink-0 border border-white/10">
                            ${u.foto ? `<img src="${u.foto}" class="w-full h-full object-cover">` : `<span class="material-symbols-outlined flex items-center justify-center h-full opacity-20">person</span>`}
                        </div>
                        <div class="min-w-0 flex-1">
                            <h4 class="font-bold truncate text-sm">${u.nome || 'Sem nome'}</h4>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[9px] font-black uppercase text-primary bg-primary/10 px-2 py-0.5 rounded border border-primary/10">${u.posicao || '-'}</span>
                                <span class="text-[9px] font-black uppercase opacity-40 bg-black/5 dark:bg-white/5 px-2 py-0.5 rounded border border-black/5 dark:border-white/5">${u.categoria || '-'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto">
                        <button onclick="setPlayerHighlight('${u.uid}')" class="flex-1 md:flex-none size-10 rounded-xl bg-accent-gold/10 text-accent-gold flex items-center justify-center active:scale-90 transition-transform" title="Destaque"><span class="material-symbols-outlined text-sm">star</span></button>
                        <button onclick="openEditModal('${u.uid}')" class="flex-1 md:flex-none size-10 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center active:scale-90 transition-transform"><span class="material-symbols-outlined text-sm">edit</span></button>
                        <button onclick="deleteUser('${u.uid}')" class="flex-1 md:flex-none size-10 rounded-xl bg-red-500/10 text-red-500 flex items-center justify-center active:scale-90 transition-transform"><span class="material-symbols-outlined text-sm">delete</span></button>
                    </div>
                </div>
            `).join('');
            updateSelectionUI();
        }

        window.toggleUserSelection = (uid) => {
            if (selectedUids.has(uid)) selectedUids.delete(uid);
            else selectedUids.add(uid);
            updateSelectionUI();
        };

        window.selectAllUsers = () => {
            selectedUids = new Set(allUsers.map(u => u.uid));
            renderUsers(allUsers);
        };

        window.deselectAllUsers = () => {
            selectedUids.clear();
            renderUsers(allUsers);
        };

        function updateSelectionUI() {
            document.getElementById('selection-counter').innerText = `${selectedUids.size} selecionados`;
            const area = document.getElementById('mass-action-area');
            if (selectedUids.size > 0) area.classList.remove('hidden');
            else area.classList.add('hidden');
        }

        window.applyMassCategory = async () => {
            const newCat = document.getElementById('mass-category').value;
            if (!newCat) return alert("Escolha uma categoria.");
            if (!confirm(`Alterar categoria de ${selectedUids.size} atletas para ${newCat}?`)) return;

            const batch = writeBatch(db);
            selectedUids.forEach(uid => {
                const ref = doc(db, 'artifacts', appId, 'users', uid, 'settings', 'profile');
                batch.update(ref, { categoria: newCat });
            });

            try {
                await batch.commit();
                alert("Categorias atualizadas!");
                selectedUids.clear();
                fetchUsers();
            } catch (err) { alert("Erro ao atualizar: " + err.message); }
        };

        window.setPlayerHighlight = async (uid) => {
            const u = allUsers.find(x => x.uid === uid);
            if (!u) return;
            if (!confirm(`Definir ${u.nome} como Destaque?`)) return;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'highlight', 'current'), {
                uid: u.uid, nome: u.nome, foto: u.foto || null,
                posicao: u.posicao, categoria: u.categoria, updatedAt: new Date().getTime()
            });
            alert('Destaque definido!');
        };

        window.openEditModal = (uid) => {
            const u = allUsers.find(x => x.uid === uid);
            if (!u) return;
            document.getElementById('edit-uid').value = uid;
            document.getElementById('edit-nome').value = u.nome || '';
            document.getElementById('edit-posicao').value = u.posicao || 'ATA';
            document.getElementById('edit-categoria').value = u.categoria || 'Sub-13';
            document.getElementById('edit-ovr').value = u.overall || 80;
            document.getElementById('edit-vel').value = u.vel || 75;
            document.getElementById('edit-dri').value = u.dri || 75;
            document.getElementById('edit-pas').value = u.pas || 75;
            document.getElementById('edit-def').value = u.def || 50;
            document.getElementById('edit-phy').value = u.phy || 60;
            
            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('edit-modal').classList.add('flex');
        };

        window.closeEditModal = () => document.getElementById('edit-modal').classList.add('hidden');

        document.getElementById('editUserForm').onsubmit = async (e) => {
            e.preventDefault();
            const uid = document.getElementById('edit-uid').value;
            const data = {
                nome: document.getElementById('edit-nome').value,
                posicao: document.getElementById('edit-posicao').value,
                categoria: document.getElementById('edit-categoria').value,
                overall: Number(document.getElementById('edit-ovr').value),
                vel: Number(document.getElementById('edit-vel').value),
                dri: Number(document.getElementById('edit-dri').value),
                pas: Number(document.getElementById('edit-pas').value),
                def: Number(document.getElementById('edit-def').value),
                phy: Number(document.getElementById('edit-phy').value),
            };
            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', uid, 'settings', 'profile'), data, { merge: true });
                alert('Dados atualizados!');
                closeEditModal();
                fetchUsers();
            } catch (err) { alert('Erro: ' + err.message); }
        };

        // Gestão de Presença
        window.openPresence = async (eventId) => {
            const container = document.getElementById('presence-list');
            container.innerHTML = '<p class="text-center py-4 opacity-40">Buscando confirmações...</p>';
            document.getElementById('presence-modal').classList.remove('hidden');
            document.getElementById('presence-modal').classList.add('flex');

            try {
                const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'events', eventId, 'presences'));
                if (snap.empty) {
                    container.innerHTML = '<p class="text-center py-4 opacity-30 text-xs">Ninguém confirmou ainda.</p>';
                    return;
                }
                container.innerHTML = snap.docs.map(d => {
                    const p = d.data();
                    return `<div class="p-3 rounded-2xl bg-black/5 dark:bg-white/5 flex items-center gap-3">
                        <div class="size-8 rounded-full bg-primary/20 flex items-center justify-center text-primary font-bold text-[10px]">${p.nome.charAt(0)}</div>
                        <div class="flex-1 min-w-0"><p class="font-bold text-xs truncate">${p.nome}</p></div>
                        <span class="material-symbols-outlined text-accent-green text-sm">check_circle</span>
                    </div>`;
                }).join('');
            } catch (e) { container.innerHTML = 'Erro ao buscar.'; }
        };

        window.closePresenceModal = () => document.getElementById('presence-modal').classList.add('hidden');

        // Render Notícias e Eventos com botão de Presença
        onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'news'), orderBy('createdAt', 'desc')), (snap) => {
            document.getElementById('news-list').innerHTML = snap.docs.map(d => {
                const item = d.data();
                return `<div class="p-4 rounded-3xl glass-panel flex justify-between items-center"><div class="flex items-center gap-4"><img src="${item.capa}" class="size-12 rounded-xl object-cover"><h4 class="font-bold text-sm truncate">${item.titulo}</h4></div><button onclick="deleteDocById('news', '${d.id}')" class="text-primary material-symbols-outlined">delete</button></div>`;
            }).join('');
        });

        onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'events'), orderBy('createdAt', 'desc')), (snap) => {
            document.getElementById('events-list').innerHTML = snap.docs.map(d => {
                const item = d.data();
                return `<div class="p-4 rounded-3xl glass-panel flex flex-col gap-4">
                    <div class="flex justify-between items-start">
                        <div><h4 class="font-bold text-sm">${item.titulo}</h4><p class="text-[10px] opacity-40 uppercase">${item.dataExtenso} • ${item.hora}</p></div>
                        <div class="flex gap-2">
                             <button onclick="openPresence('${d.id}')" class="text-accent-gold material-symbols-outlined">group</button>
                             <button onclick="deleteDocById('events', '${d.id}')" class="text-primary material-symbols-outlined">delete</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        });

        window.deleteDocById = async (col, id) => {
            if (confirm('Apagar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id));
        };

        if (localStorage.theme === 'light') document.documentElement.classList.remove('dark');
        updateThemeIcon();

    </script>
</body>
</html>
